<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* the saved theme before the first paint, so a dark setting never flashes the light page */
      try {
        var t = localStorage.getItem('ctu.theme') || 'system'
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
        var a = (localStorage.getItem('ctu.accent.lch') || '').split(' ')
        if (a.length === 3) { var st = document.documentElement.style; st.setProperty('--acc-l', a[0]); st.setProperty('--acc-c', a[1]); st.setProperty('--acc-h', a[2]) }
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=Caveat:wght@400..700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <title>Waymark</title>
    <meta name="application-name" content="Waymark" />
    <meta name="description" content="Waymark: your study day, tests, notebook and coach in one place." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
