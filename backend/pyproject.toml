[project]
name = "ctu-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "gal1ce", email = "3nesslbr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.12.0",
    "fastapi>=0.165.0",
    "python-dotenv>=1.2.4",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.scripts]
ctu-backend = "ctu_backend:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
